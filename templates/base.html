<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clearer Weather{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="theme-dark">
    <header class="site-header">
        <a href="{{ url_for('index') }}" class="logo">Clearer Weather</a>
        <form class="search-form" action="{{ url_for('weather') }}" method="get">
            <input type="text" name="location" placeholder="ZIP, city/state, or lat,lon" 
                   value="{{ location_input|default('', true) }}" autocomplete="off" class="search-input">
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <button type="button" class="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme"></button>
    </header>
    <div id="loading-overlay" class="loading-overlay hidden">
        <div>
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading forecast…</p>
        </div>
    </div>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>Data from <a href="https://www.weather.gov" target="_blank" rel="noopener">National Weather Service</a> • Clearer Weather on Raspberry Pi</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
